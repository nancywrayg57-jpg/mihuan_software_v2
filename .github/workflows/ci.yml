name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-check:
    name: governance-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify governance files
        run: |
          test -f Agent.md
          test -f .github/CODEOWNERS
          test -d docs/agent
          test -d docs/architecture_decisions
          grep -Fx '* @nancywrayg57-jpg' .github/CODEOWNERS
          grep -F '.github/ @nancywrayg57-jpg' .github/CODEOWNERS
          grep -F 'Agent.md @nancywrayg57-jpg' .github/CODEOWNERS

  site-build:
    name: site-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check site
        run: npm run check
