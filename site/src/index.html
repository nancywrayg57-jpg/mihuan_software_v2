<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Honey Badger Site Scaffold</title>
    <style>
      :root {
        color-scheme: light;
        --page-bg: #f6f9fc;
        --panel-bg: #ffffff;
        --text-primary: #132238;
        --text-muted: #52647a;
        --accent: #1463ff;
        --accent-soft: #dbe8ff;
        --border: #d8e2ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text-primary);
        background: var(--page-bg);
        font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      }

      .shell {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 40px 20px;
      }

      .panel {
        width: min(100%, 760px);
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel-bg);
        padding: clamp(28px, 5vw, 48px);
        box-shadow: 0 16px 48px rgb(19 34 56 / 8%);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .notice {
        display: inline-flex;
        align-items: center;
        margin: 24px 0 18px;
        border-radius: 999px;
        background: var(--accent-soft);
        padding: 8px 14px;
        color: #0a45bf;
        font-weight: 700;
      }

      .summary {
        margin: 0;
        color: var(--text-muted);
        font-size: 1rem;
        line-height: 1.8;
      }

      .checks {
        display: grid;
        gap: 10px;
        margin: 28px 0 0;
        padding: 0;
        list-style: none;
      }

      .checks li {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--text-muted);
        line-height: 1.5;
      }

      @media (min-width: 700px) {
        h1 {
          font-size: 3.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-labelledby="page-title">
      <section class="panel">
        <p class="eyebrow">Production Site Scaffold</p>
        <h1 id="page-title">蜜獾官网生产工程骨架</h1>
        <p class="notice">开发骨架，非正式内容</p>
        <p class="summary">
          此页面仅用于验证 site/src 到 site/dist 的静态构建链路。正式页面、三语内容、品牌资产与上线配置将在后续 Issue 中按需求接入。
        </p>
        <ul class="checks" aria-label="当前骨架范围">
          <li>静态源文件位于 site/src。</li>
          <li>构建产物输出到 site/dist。</li>
          <li>UI 原型只作为参考源，不参与本次生产构建。</li>
        </ul>
      </section>
    </main>
  </body>
</html>
